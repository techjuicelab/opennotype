 strength:{title:'AI 편집 강도',body:'선택한 표현 방향을 어느 정도 적용할지 조절합니다. 0이거나 현재 받아쓰기이면 기존 정리 방식으로 처리합니다.',scope:'간결하게·핵심 요약·명확하게·자세하게·창의적으로를 선택했을 때 조절할 수 있습니다.',notice:'강도를 높여도 사실·의도·말투의 강도를 임의로 바꾸도록 허용하지 않습니다.'},

 nameCatalog:{title:'검토에 참고할 이름',body:'앱·프로젝트 이름을 문장 검토의 참고 후보로 관리합니다. 실제 개인 사전의 교정 매핑과는 별도입니다.',scope:'직접 등록한 이름을 사용하며 앱 이름을 자동 수집하거나 같은 소리의 단어를 모두 바꾸는 설정은 아닙니다.'},
 profiles:{title:'앱별 작성 방식',body:'앱에 따라 문장 형식과 말투를 정합니다. 지정하지 않은 앱은 기본 작성 방식을 사용합니다.',scope:'말한 내용을 정리하는 방식이며, 해당 앱의 주변 문맥을 읽는 권한과는 별도입니다.',notice:'주변 문맥은 개인정보 설정에서 따로 허용한 앱만 사용할 수 있습니다.'},
 review:{title:'자동 문장 검토 · Jev',body:'끔은 자동 검토를 실행하지 않습니다. 입력 후 검토는 먼저 입력한 뒤 검토하며 이미 입력한 글을 자동으로 바꾸지 않습니다. 검토를 실행하면 문장 정리 결과와 인식 원문을 검토 서비스로 보냅니다.',scope:'입력 전 확인은 검토 실패·시간 초과 때 기존 결과를 입력할 수 있습니다. 입력 전 검토·교정은 검토를 확인하지 못하거나 오류가 남으면 입력을 보류합니다.',notice:'바로 입력에는 자동 검토가 적용되지 않습니다. 번역에서는 입력 전 확인과 번역 검토를 함께 켰을 때만 해당 보호를 사용합니다. 직접 요청한 검토는 별도이며 추가 전송·비용이 발생할 수 있습니다.'},
 translationReview:{title:'번역도 입력 전에 검토',body:'자동 검토가 입력 전 확인일 때 번역도 입력 전에 Jev로 검토합니다.',scope:'인식 원문·번역 결과·목표 언어·말투를 추가 전송합니다. 번역을 자동 교정하는 기능은 아닙니다.',notice:'일반 받아쓰기의 입력 전 확인과 달리, 번역 검토 실패나 위험 신호가 있으면 자동 입력을 보류합니다.'},
 gesture:{title:'단축키 동작',body:'한 번 눌러 시작·종료는 다시 누를 때까지 녹음합니다. 누르는 동안 녹음은 키를 떼면 종료합니다.',scope:'짧게 누르거나 길게 누르기는 짧게 누르면 계속 녹음하고, 길게 누르면 키를 떼는 순간 끝냅니다.'},
 microphone:{title:'녹음 마이크',body:'시스템 기본 마이크 또는 특정 장치를 선택합니다. 이 선택은 Mac의 시스템 기본 입력을 변경하지 않습니다.',scope:'지정한 마이크가 연결되지 않으면 다른 마이크로 몰래 바꾸지 않고 연결 상태를 알려 줍니다.'},
 sound:{title:'준비·종료 알림음',body:'마이크가 실제 음성을 받을 준비가 됐을 때와 녹음을 끝낼 때 소리로 알려 줍니다.',notice:'시스템 소리 음소거를 함께 사용하면 준비 알림음이 들리지 않을 수 있습니다.'},
 mute:{title:'녹음 중 시스템 소리 음소거',body:'녹음 중 시스템 출력을 음소거하고 녹음이 끝나면 이전 상태로 복원합니다.',notice:'녹음 중 직접 바꾼 상태는 존중합니다. 장치가 음소거를 지원하지 않으면 시작 오류를 알려 줍니다.'},
 model:{title:'로컬 음성 모델',body:'이 Mac에서 음성을 인식할 때 사용할 모델입니다. 모델 선택과 파일 다운로드·준비는 별도입니다.',scope:'한국어와 영어를 지원한다는 것이 혼용·고유명사 정확도를 보장하지는 않습니다. 같은 실제 음성으로 비교해 보세요.'},
 memory:{title:'모델 메모리 유지',body:'사용하지 않을 때 메모리에 올린 모델을 언제 해제할지 정합니다. 다운로드한 파일은 남습니다.',notice:'해제 후 다음 녹음에는 모델을 다시 준비하므로 시작이 느려질 수 있습니다.'},
 preview:{title:'녹음 중 미리보기',body:'로컬 인식에서 최근 발화를 반복 인식해 표시하는 실험 기능입니다. 화면의 미리보기는 확정 결과가 아닙니다.',scope:'최종 입력은 전체 녹음을 다시 인식합니다. 추가 연산이 필요하며 내 목소리 구분을 켜면 미리보기를 사용하지 않습니다.'},
 speaker:{title:'내 목소리 구분',body:'등록한 목소리의 단독 발화 구간을 찾는 실험 기능입니다. 모델 준비와 목소리 등록이 먼저 필요합니다.',notice:'실사용 환경의 성능을 보장하지 않습니다. 등록 원음은 삭제하고 특징을 암호화해 보관합니다.'},
 history:{title:'처리 결과 기록',body:'인식 원문과 처리 결과를 이 Mac의 암호화 저장소에 보관합니다.',notice:'기록을 끄면 관련 진행 작업·검토 데이터의 기존 정리 정책이 적용됩니다. 실제 적용 전에 영향 안내를 유지해야 합니다.'},
 retention:{title:'텍스트 보관 기간',body:'기록을 얼마나 보관할지 정합니다. 선택한 기간이 지난 텍스트는 기존 정책에 따라 정리합니다.',scope:'실패 원음은 텍스트와 별개로 24시간 암호화 보관합니다. 성공한 원음은 기존 정책에 따라 삭제합니다.'},
 learning:{title:'고친 표기 기억하기',body:'사용자가 고친 표현에서 제한적으로 표기 후보를 제안하는 개인 사전 학습입니다.',scope:'Jev 검토에서 해결한 오류 유형을 기억하는 기능과 별개이며 AI 모델 자체를 재학습하지 않습니다.'}
};
const titles={home:'받아쓰기',history:'기록',dictionary:'개인 사전',settings:'설정'};
const sectionNames={dictation:'받아쓰기',recording:'녹음·단축키',connections:'AI 연결',privacy:'개인정보',general:'앱 관리',advanced:'고급 도구'};
const infoIcon='<svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5m0-8v1"/></svg>';
const help=(id,title)=>`<button class="help" data-help="${id}" aria-label="${escapeHTML(title||helpData[id].title)} 도움말" aria-expanded="false" aria-controls="helpPop"><span aria-hidden="true">?</span></button>`;
const row=(title,id,control,note='')=>`<div class="row"><div class="label-wrap"><div class="label">${title}${id?help(id,title):''}</div>${note?`<div class="row-note">${note}</div>`:''}</div><div class="controls">${control}</div></div>`;
const options=(items,key)=>`<select data-field="${key}" aria-label="${({mode:'받아쓰기 처리',language:'받아쓰기 출력 언어',expression:'받아쓰기 표현',review:'자동 문장 검토',gesture:'단축키 동작',mic:'녹음 마이크',model:'로컬 음성 모델',memory:'모델 메모리 유지',retention:'텍스트 보관 기간',translationTarget:'번역 단축키 출력 언어'})[key]||key}">${items.map(([v,t])=>`<option value="${v}" ${String(state[key])===v?'selected':''}>${t}</option>`).join('')}</select>`;
const toggle=(key,label,disabled=false)=>`<label class="switch"><input type="checkbox" data-field="${key}" aria-label="${label}" ${state[key]?'checked':''} ${disabled?'disabled':''}><span class="track"></span></label>`;
const group=(body,title='')=>`<section class="group">${title?`<h3 class="group-title">${title}</h3>`:''}${body}</section>`;
const wave=()=>'<div class="wave" aria-hidden="true">'+[16,27,40,30,19].map(h=>`<i style="height:${h}px"></i>`).join('')+'</div>';
const sampleText='PostgreSQL 17.2로 바꾸고, 10월 18일에 배포해 주세요.\nAPI 변경 사항은 GitHub에 정리해 두겠습니다.';
const sourceText='어 PostgreSQL 17.2로 바꾸고요, 10월 18일에 배포해 주세요. API 변경 사항은 GitHub에 정리해 둘게요.';
function effectiveText(){if(state.language!=='original')return `${({english:'영어',japanese:'일본어',korean:'한국어'})[state.language]}로 번역 · AI 처리 사용 중`;return state.mode==='fast'?'말한 언어 유지 · 이 Mac에서 인식 · 문장 정리 없이 입력':'말한 언어 유지 · AI 문장 정리 후 입력';}
function render(){closeHelp(false);$('#pageTitle').textContent=titles[state.page];document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===state.page);b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false')});$('#headerStatus').textContent=state.page==='settings'?'설정 미리보기':state.demo==='ready'?'받아쓰기 준비됨':({first:'준비 필요',listening:'녹음 중',processing:'문장 정리 중',held:'입력 보류',unverified:'입력 확인 필요',failed:'처리 실패'})[state.demo];$('#content').innerHTML=state.page==='settings'?settings():state.page==='home'?home():state.page==='history'?history():dictionary();renderBar();}
function settings(){return `<div class="settings-layout"><nav class="settings-nav" aria-label="설정 분류">${Object.entries(sectionNames).map(([k,v])=>`<button data-section="${k}" class="${state.section===k?'active':''}" aria-current="${state.section===k?'page':'false'}">${v}</button>`).join('')}</nav><div class="settings-panel"><div class="sectionhead"><h2>${sectionNames[state.section]}</h2>${state.section==='advanced'?'<span class="tag">실험·문제 해결</span>':''}</div>${settingsPanel()}<p class="footnote">일반 설정은 다음 녹음부터 적용됩니다. API 키는 별도로 저장합니다.</p></div></div>`;}
function settingsPanel(){
 if(state.section==='dictation'){
 const translation=state.language!=='original', inactive=translation||state.mode==='fast';
 return `<div class="effective ${translation&&state.mode==='fast'?'warning':''}" role="status">${infoIcon}<span>${effectiveText()}${translation&&state.mode==='fast'?'<br>저장된 바로 입력 설정은 번역 중에는 적용되지 않습니다.':''}</span></div>`+
 group(row('받아쓰기 처리','processing',options([['clean','정리해서 입력'],['fast','바로 입력 · 이 Mac']], 'mode'))+row('출력 언어','language',options([['original','말한 언어 유지'],['english','영어'],['japanese','일본어'],['korean','한국어']], 'language')))+
 group(row('받아쓰기 표현','expression',`<span class="${inactive?'dim':''}">${options([['faithful','현재 받아쓰기'],['concise','간결하게'],['summary','핵심 요약'],['clear','명확하게'],['expanded','자세하게'],['creative','창의적으로']], 'expression').replace('<select',inactive?'<select disabled':'<select')}</span><button class="quiet small" data-action="examples">예시</button>`,inactive?'현재 미적용 · AI 정리와 말한 언어 유지에서 사용':'')+row('AI 편집 강도','strength',`<div class="range-control"><input aria-label="AI 편집 강도" type="range" data-field="strength" min="0" max="100" value="${state.strength}" ${inactive||state.expression==='faithful'?'disabled':''}><span class="mono small">${state.strength}</span></div>`)+row('앱별 작성 방식','profiles','<button data-action="profiles">관리…</button>'))+
 group(row('번역 단축키 출력 언어','translationLanguage',options([['english','영어 · 미국식'],['korean','한국어'],['japanese','일본어']], 'translationTarget'))+row('번역 문장 다듬기','refine',`<span class="tag ${state.refine?'warn':''}">${state.refine?'실험 · 추가 요청 · 실패 시 보류':'실험 기능'}</span>${toggle('refine','번역 문장 다듬기')}`),'번역')+
 group(row('자동 문장 검토','review',options([['off','끔'],['observe','입력 후 검토'],['protect','입력 전 확인'],['repair','입력 전 검토·교정']], 'review'),translation?(state.review==='protect'&&state.translationReview?'번역 검토 · 추가 요청 · 실패 시 입력 보류':'일반 받아쓰기 검토는 현재 미적용'):state.mode==='fast'?'현재 미적용 · 바로 입력은 자동 검토 생략':state.review==='repair'?'추가 요청 · 검토 실패·미해결 시 입력 보류':state.review==='protect'?'추가 요청 · 검토 실패 시 기존 결과를 입력할 수 있음':state.review==='observe'?'추가 요청 · 입력 후 검토':'')+row('번역도 입력 전에 검토','translationReview',toggle('translationReview','번역도 입력 전에 검토',state.review!=='protect'),state.review!=='protect'?'현재 미적용 · 입력 전 확인에서 사용':state.translationReview?'번역 검토 실패 시 입력 보류':''),'문장 검토 · 실험');

function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000);}
function action(a){const simple={copy:['결과 복사',`<p>복사할 결과를 확인합니다.</p><textarea aria-label="복사할 결과" readonly>${escapeHTML(selectedResult().text)}</textarea>`],profiles:['앱별 작성 방식','<p>기본 말투는 말한 대로 유지합니다. 앱에 따로 지정한 작성 방식만 적용합니다.</p>'+group(row('기본 작성 방식','', '<span class="muted">말한 말투 유지</span>')+row('앱별 설정','', '<span class="muted">등록한 앱 없음</span>'))],examples:['받아쓰기 표현 예시','<p class="small muted">실제 모델 출력이 아닌 설명용 예시입니다. 예시를 보는 것만으로 설정이 바뀌지 않습니다.</p><h3>말한 내용</h3><p>자료를 확인하고, 문제가 있으면 알려 주실 수 있을까요?</p><h3>간결하게</h3><p>자료를 확인해 문제가 있으면 알려 주실 수 있을까요?</p>'],connection:['AI 연결 관리','<p>음성 인식·문장 처리·Jev 검토의 연결을 각각 관리합니다.</p>'+group(row('연결 상태','', '<span class="muted">예시 · 저장된 키 있음</span>'))+'<p class="small muted">키 저장과 실제 서비스 연결 확인은 서로 다릅니다.</p>'],model:['로컬 모델 관리','<p>선택한 모델의 다운로드 파일과 메모리 준비 상태를 따로 보여 줍니다.</p>'+group(row('Whisper Large v3','', '<span class="tag green">파일 준비됨 · 예시</span>')+row('모델 파일 삭제','', '<button class="danger" data-action="deleteModel">삭제…</button>'))],deleteModel:['모델 파일을 삭제할까요?','<p>선택한 모델 파일만 삭제합니다. 기록·사전·다른 모델은 유지됩니다. 다시 사용하려면 다운로드가 필요합니다.</p>'],usage:['사용량과 비용','<p>기존 사용량 화면의 기간·모델별 요청·비용을 이곳에서 확인합니다.</p><p class="small muted">시안에는 실제 사용량이나 가상의 성능 수치를 표시하지 않습니다.</p>'],transfer:['현재 처리에서 전송되는 정보',`<p>${effectiveText()}</p><p>온라인 인식은 녹음을 음성 인식 제공자에, AI 정리는 인식문과 요청을 문장 제공자에 보냅니다. 바로 입력은 해당 받아쓰기를 이 Mac에서 처리합니다.</p>`],context:['앱별 주변 문맥','<p>허용한 앱에서만 주변 문맥을 읽습니다. 앱별 작성 방식과 별도이며, 허용하지 않은 앱을 자동 추가하지 않습니다.</p>'],permissions:['Mac 접근 권한',group(row('마이크','', '<span class="tag green">예시 · 허용됨</span>')+row('손쉬운 사용','', '<span class="tag green">예시 · 허용됨</span>'))+'<p>실제 권한은 시스템 설정에서 관리합니다.</p>'],inputTest:['다른 앱 입력 테스트','<p>빈 입력창을 직접 클릭한 뒤 테스트 단축키를 누릅니다. 실제 앱에서는 테스트 문장이 입력되므로 전송 버튼이 있는 대화창 대신 빈 문서에서 확인합니다.</p>'],diagnostics:['연결·입력 진단','<p>연결 확인, 단축키 충돌, 최근 처리 시간을 필요할 때 확인합니다.</p><p class="small muted">입력 확인 대기는 글이 실제 화면에 나타난 시각과 다를 수 있습니다.</p>'],jevOptions:['문장 검토 추가 도움','<p>세부 검토, 비용 절약, 오류 유형 반영, 별도 개선안, 모호한 수정 지시 확인, 음성 재인식을 구분해 관리합니다.</p><p>사용 중인 옵션은 접힌 상태에서도 요약에 남깁니다. 자동으로 켜거나 설정값을 합치지 않습니다.</p>'],audioLab:['음성 모델 비교','<p>같은 음성을 준비된 로컬 모델로 비교합니다. 음성 파일·정답·숫자와 고유명사 검토를 별도로 확인합니다.</p><p class="small muted">CER은 종합 정확도나 의미 충실성의 보장이 아닙니다.</p>'],textLab:['문장 모델 비교','<p>직접 고른 문장과 원하는 결과로 모델을 비교합니다. 전송할 내용과 비용 한도를 확인한 뒤 시작하며 추천은 직접 적용합니다.</p>'],review:['Jev로 검토할 내용','<p>인식 원문과 결과, 필요한 표기 후보를 검토 서비스에 보냅니다. 추가 요청·비용이 발생할 수 있습니다.</p><details open><summary>전송할 문장 보기</summary><p>'+escapeHTML(selectedResult().source)+'</p></details>'],reprocess:['다시 처리','<p>원문과 당시 처리 정보를 확인한 뒤 재처리합니다. 새 결과는 미리보기로 확인하며 기존 입력을 자동 덮어쓰지 않습니다.</p>'],retryOriginal:['당시 설정으로 다시 처리','<p>보관된 인식·문장 모델과 언어를 사용합니다. 보관되지 않은 일부 설정에는 현재값이 쓰입니다.</p><p>재처리 결과는 확인·복사용이며 자동 입력하지 않습니다.</p>'],retryCurrent:['현재 설정으로 다시 처리','<p>현재 선택한 인식·문장 모델과 처리 설정을 사용합니다. 전송 대상과 비용이 이전 처리와 달라질 수 있습니다.</p>'],manualTranscript:['인식 원문 직접 입력','<label class="field">음성의 내용을 입력해 주세요<textarea aria-label="인식 원문"></textarea></label>'],deleteAudio:['보관된 녹음을 삭제할까요?','<p>이 녹음으로 다시 처리할 수 없게 됩니다. 실제 삭제는 실행하지 않는 확인 화면 시안입니다.</p>'],addWord:['개인 사전 단어 추가','<label class="field">말하는 표현<input type="text" placeholder="예: 오픈 노타입"></label><label class="field">사용할 표기<input type="text" placeholder="예: OpenNoType"></label>'],editWord:['개인 사전 편집','<p>말하는 표현과 사용할 표기를 함께 편집합니다. 같은 소리의 다른 의미까지 강제로 바꾸는 설정은 아닙니다.</p>'],learning:['검토할 표기 후보','<p>명확한 표기 교정은 자동으로 기억하고, 확인이 필요한 변경은 후보로 제안합니다. 후보를 직접 검토하거나 자동으로 반영한 표기를 되돌릴 수 있습니다.</p>'],nameCatalog:['검토에 참고할 이름','<p>앱·프로젝트 이름을 Jev 검토의 참고 후보로 관리합니다. 개인 사전의 교정 매핑과 구분합니다.</p>'],shortcut:['단축키 변경','<p>새 키 조합을 받고 기존 중복·잘못된 값 검사를 유지합니다. 녹음 방식 설명은 선택한 동작에 맞춰 함께 바뀝니다.</p>'],update:['앱 업데이트','<p>버전과 업데이트 상태를 확인합니다. 녹음·처리 중 설치를 막는 기존 보호를 유지합니다.</p>'],license:['모델 출처·라이선스','<p>사용 중인 모델과 라이브러리의 기존 고지를 여기서 확인합니다.</p>'],translate:['번역','<p>입력할 앱에서 <kbd>⌥ ⇧ Space</kbd>로 시작합니다.</p><p>평소 받아쓰기의 출력 언어와 별도로 번역 단축키에 지정한 언어를 사용합니다.</p>'],rewrite:['선택 문장 수정','<p>입력할 앱에서 수정할 문장을 먼저 선택하고 <kbd>⌥ ⌘ Space</kbd>를 누릅니다.</p>'],prompt:['프롬프트 만들기','<p>목표와 조건을 말해 AI 지시문을 만듭니다. 여기서 시작하면 복사용 결과를 만들며 AI에 자동 제출하지 않습니다.</p><p>다른 앱의 단축키로 시작한 경우에는 기존 입력 경로를 사용합니다.</p><p class="small muted">음성 인식 뒤 문장 생성과 Jev 검토에 추가 요청·비용이 발생합니다.</p>']};if(a==='recovery'){state.page='history';state.historyTab='recovery';render();return;}if(a==='appearance'){$('#theme').click();return;}const item=simple[a];if(item)openDialog(item[0],item[1]);}
function renderBar(){const b=$('#recordingBar');b.hidden=!['listening','processing'].includes(state.demo);if(b.hidden)return;b.innerHTML=`<button data-demo-cancel aria-label="녹음 또는 처리 취소">×</button>${wave()}<div class="bar-text"><strong>${state.demo==='listening'?'듣고 있어요':'문장 정리 중'}</strong><p>${state.demo==='listening'?'00:12 · 녹음 상태 예시':'실제 처리 단계에 따라 표시'}</p><p class="bar-warning">경고가 있어도 주 상태와 시간은 유지합니다.</p></div>${state.demo==='listening'?'<button data-demo-stop aria-label="녹음 종료 후 처리">■</button>':''}`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.help){openHelp(b.dataset.help,b);return;}if(b.hasAttribute('data-close-help')){closeHelp();return;}if(b.dataset.page){state.page=b.dataset.page;state.search='';render();return;}if(b.dataset.section){state.section=b.dataset.section;render();return;}if(b.dataset.goto){state.page='settings';state.section=b.dataset.goto;render();return;}if(b.dataset.action){action(b.dataset.action);return;}if(b.dataset.historyTab){state.historyTab=b.dataset.historyTab;render();return;}if(b.dataset.record){state.record=Number(b.dataset.record);render();return;}if(b.hasAttribute('data-close-dialog')||b.id==='dialogClose'){closeDialog();return;}if(b.hasAttribute('data-demo-cancel')){state.demo='ready';$('#demoState').value='ready';render();return;}if(b.hasAttribute('data-demo-stop')){state.demo='processing';$('#demoState').value='processing';render();return;}}if(e.target===$('#overlay'))closeDialog();if(!$('#helpPop').hidden&&!e.target.closest('#helpPop')&&!e.target.closest('[data-help]'))closeHelp(false);});
document.addEventListener('change',e=>{const key=e.target.dataset.field;if(key){state[key]=e.target.type==='checkbox'?e.target.checked:e.target.type==='range'?Number(e.target.value):e.target.value;const oldKey=key;render();const replacement=document.querySelector(`[data-field="${oldKey}"]`);if(replacement)replacement.focus();}});
document.addEventListener('input',e=>{if(e.target.id==='historySearch'){const pos=e.target.selectionStart;state.search=e.target.value;render();const n=$('#historySearch');n.focus();n.setSelectionRange(pos,pos);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#overlay').hidden){closeDialog();e.preventDefault();}else if(!$('#helpPop').hidden){closeHelp();e.preventDefault();}}if(e.key==='Tab'&&!$('#overlay').hidden){const f=[...$('#overlay').querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);const first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
$('#demoState').addEventListener('change',e=>{state.demo=e.target.value;state.page='home';render();});
$('#theme').addEventListener('click',()=>{const dark=document.body.classList.toggle('theme-dark');$('#theme').textContent=dark?'라이트 모드':'다크 모드';$('#theme').setAttribute('aria-pressed',String(dark));closeHelp(false);});
function closeHelpOnViewportChange(){closeHelp($('#helpPop').contains(document.activeElement));}
window.addEventListener('resize',closeHelpOnViewportChange);window.addEventListener('scroll',e=>{if(!e.target.closest?.('#helpPop'))closeHelpOnViewportChange();},true);
render();
</script>
</body>
</html>
