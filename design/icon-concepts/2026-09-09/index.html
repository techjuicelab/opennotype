<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>OpenNoType · macOS 아이콘 시안 6종</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f1f1ef;
      --card: #fafaf9;
      --ink: #222320;
      --muted: #747670;
      --line: #ddded9;
      --button: #ffffff;
      --focus: #3262c8;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #1b1c1d;
      --card: #242527;
      --ink: #f2f2ee;
      --muted: #abadab;
      --line: #3b3d3e;
      --button: #303234;
      --focus: #91b5ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background .2s, color .2s;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .page { max-width: 1264px; margin: 0 auto; padding: 28px 32px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 7px; font-size: 11px; letter-spacing: .14em; font-weight: 650; color: var(--muted); }
    h1 { margin: 0; font-size: 23px; line-height: 1.35; letter-spacing: -.04em; font-weight: 650; }
    .theme-toggle {
      display: flex; flex: 0 0 auto; align-items: center; gap: 8px;
      padding: 11px 14px; min-height: 44px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--button); color: var(--ink); cursor: pointer; font-size: 12px; font-weight: 550;
    }
    .theme-toggle svg { width: 16px; height: 16px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .card-heading { display: flex; align-items: center; gap: 13px; padding: 16px 20px 0; }
    .number { font-size: 27px; font-weight: 550; letter-spacing: -.06em; font-variant-numeric: tabular-nums; line-height: 1; }
    h2 { font-size: 15px; line-height: 1.4; font-weight: 600; letter-spacing: -.025em; margin: 0; }
    .open-image {
      appearance: none; display: flex; align-items: center; justify-content: center; position: relative;
      width: calc(100% - 32px); height: 198px; margin: 4px 16px 0; border: 0; border-radius: 12px;
      background: transparent; color: var(--ink); cursor: zoom-in;
    }
    .hero { display: block; width: 192px; height: 192px; object-fit: contain; border-radius: 9px; }
    .enlarge-hint {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: #222b; color: white; backdrop-filter: blur(12px); border-radius: 99px;
      padding: 6px 10px; font-size: 10px; opacity: 0; transition: opacity .15s; pointer-events: none;
    }
    .open-image:hover .enlarge-hint, .open-image:focus-visible .enlarge-hint { opacity: 1; }
    .sizes { display: flex; align-items: center; justify-content: center; gap: 32px; min-height: 98px; margin: 2px 18px 0; border-top: 1px solid var(--line); }
    .sample { display: flex; align-items: center; gap: 10px; }
    .sample img { display: block; object-fit: contain; border-radius: 3px; }
    .sample span { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    footer { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); font-size: 11px; line-height: 1.6; margin-top: 17px; }
    footer p { margin: 0; }
    dialog {
      width: min(850px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
      margin: auto; padding: 0; border: 1px solid var(--line); border-radius: 20px;
      background: var(--card); color: var(--ink); box-shadow: 0 24px 90px #0005;
    }
    dialog::backdrop { background: #101112ba; backdrop-filter: blur(8px); }
    .dialog-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px 12px 22px; }
    .dialog-title { font-size: 17px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
    .dialog-actions { display: flex; gap: 10px; align-items: center; }
    .source-link { color: var(--muted); font-size: 12px; text-underline-offset: 3px; }
    .close {
      display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
      border: 1px solid var(--line); border-radius: 12px; background: var(--button); color: var(--ink); cursor: pointer;
    }
    .close svg { width: 18px; height: 18px; }
    .full-image { display: block; width: 100%; height: min(750px, calc(100dvh - 104px)); object-fit: contain; }
    @media (min-width: 1000px) and (max-height: 800px) {
      .page { padding-top: 20px; }
      header { margin-bottom: 16px; }
      .open-image { height: 170px; }
      .hero { width: 166px; height: 166px; }
      .sizes { min-height: 86px; }
    }
    @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 590px) {
      .page { padding: 22px 16px; }
      header { align-items: flex-start; gap: 12px; }
      h1 { font-size: 20px; }
      .theme-toggle { padding: 10px; }
      .theme-toggle .toggle-prefix { display: none; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .open-image { height: 228px; }
      .hero { width: 220px; height: 220px; }
      footer { flex-direction: column; gap: 3px; }
      .source-link { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">OPENNOTYPE · MACOS</p>
        <h1>메인 아이콘 시안 6종</h1>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="어두운 배경으로 전환">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>
        <span><span class="toggle-prefix">배경 </span><span id="theme-label">밝음</span></span>
      </button>
    </header>
    <section class="grid" id="concepts" aria-label="아이콘 시안 비교"></section>
    <footer>
      <p>아이콘을 누르면 크게 볼 수 있습니다. 각 시안 아래는 32px · 64px 크기입니다.</p>
      <p>선택을 위한 디자인 시안 · 2026.09.09</p>
    </footer>
  </main>
  <dialog id="preview" aria-labelledby="preview-title">
    <div class="dialog-bar">
      <h2 class="dialog-title" id="preview-title"></h2>
      <div class="dialog-actions">
        <a class="source-link" id="source-link" target="_blank" rel="noopener">원본 파일 열기</a>
        <button class="close" id="close-preview" type="button" aria-label="확대 보기 닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <img class="full-image" id="full-image" alt="">
  </dialog>
  <script>
    const concepts = [
      { id: '01', name: '유리 파형', slug: 'glass-wave' },
      { id: '02', name: '보이스 키', slug: 'voice-key' },
      { id: '03', name: '오픈 N', slug: 'open-n' },
      { id: '04', name: '종이 깃펜', slug: 'paper-quill' },
      { id: '05', name: '도자기 말풍선', slug: 'ceramic-speech' },
      { id: '06', name: '스튜디오 마이크', slug: 'studio-mic' }
    ];
    const grid = document.getElementById('concepts');
    const dialog = document.getElementById('preview');
    for (const concept of concepts) {
      const source = `${concept.id}-${concept.slug}.png`;
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-heading"><span class="number">${concept.id}</span><h2>${concept.name}</h2></div>
        <button type="button" class="open-image" aria-label="${concept.id}번 ${concept.name} 확대 보기">
          <img class="hero" src="${source}" alt="${concept.name} macOS 앱 아이콘 시안" width="192" height="192">
          <span class="enlarge-hint" aria-hidden="true">원본 확대</span>
        </button>
        <div class="sizes" aria-label="작은 크기 비교">
          <div class="sample"><img src="${source}" alt="" width="32" height="32"><span>32px</span></div>
          <div class="sample"><img src="${source}" alt="" width="64" height="64"><span>64px</span></div>
        </div>`;
      card.querySelector('button').addEventListener('click', () => {
        document.getElementById('preview-title').textContent = `${concept.id} · ${concept.name}`;
        const fullImage = document.getElementById('full-image');
        fullImage.src = source;
        fullImage.alt = `${concept.name} macOS 앱 아이콘 시안 원본`;
        document.getElementById('source-link').href = source;
        dialog.showModal();
      });
      grid.append(card);
    }
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.getElementById('theme-label').textContent = dark ? '어두움' : '밝음';
      themeToggle.setAttribute('aria-pressed', String(dark));
      themeToggle.setAttribute('aria-label', dark ? '밝은 배경으로 전환' : '어두운 배경으로 전환');
    });
    document.getElementById('close-preview').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target !== dialog) return;
      const bounds = dialog.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
    });
  </script>
</body>
</html>
