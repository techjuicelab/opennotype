name: Publish verified stable release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Choose the distribution explicitly. A notarization failure never falls back.
env:
  RELEASE_SIGNING_MODE: community

# Keep the entire validation/publication transaction serial, including queued tags.
concurrency:
  group: opennotype-stable-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.repository == 'techjuicelab/opennotype'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate explicit distribution mode
        run: |
          case "$RELEASE_SIGNING_MODE" in
            community|notarized) ;;
            *) echo 'Unsupported release signing mode; no release will be published.' >&2; exit 1 ;;
          esac
      - name: Validate stable tag, source, and published version history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release-preflight.py --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" --check-git --check-remote
      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          swift --version
      - name: Run application and release contract tests before loading signing keys
        env:
          SPARKLE_TEST_ARTIFACT_DIR: ${{ github.workspace }}/.build/artifacts/sparkle/Sparkle
        run: |
          # Tests select their own modes; the publishing choice is inherited by packaging only.
          unset RELEASE_SIGNING_MODE
          swift test
          python3 -m unittest discover -s scripts -p 'test*.py'
      - name: Materialize the short-lived Sparkle signing file
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = os.environ.get('SPARKLE_KEY', '').strip()
          if not key:
              raise SystemExit('The Sparkle signing secret is not configured; no release will be published.')
          directory = Path(os.environ['RUNNER_TEMP']) / 'opennotype-release-secrets'
          directory.mkdir(mode=0o700)
          descriptor = os.open(directory / 'sparkle.key', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'wb') as stream:
              stream.write(key.encode())
          PY
      - name: Validate and materialize Apple signing files for notarized distribution
        if: env.RELEASE_SIGNING_MODE == 'notarized'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'opennotype-release-secrets'
          required = ('CERTIFICATE_P12_BASE64', 'P12_PASSWORD', 'NOTARY_P8',
                      'DEVELOPER_ID_APPLICATION', 'NOTARY_KEY_ID', 'NOTARY_ISSUER')
          if not all(os.environ.get(name) for name in required):
              raise SystemExit('Required notarized distribution credentials are not configured; no release will be published.')
          try:
              certificate = base64.b64decode(os.environ['CERTIFICATE_P12_BASE64'], validate=True)
          except ValueError:
              raise SystemExit('The certificate deployment copy is not valid base64.')
          values = {'certificate.p12': certificate,
                    'notary.p8': os.environ['NOTARY_P8'].encode()}
          for name, data in values.items():
              descriptor = os.open(directory / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, 'wb') as stream:
                  stream.write(data)
          PY
      - name: Import Developer ID identity without password arguments
        if: env.RELEASE_SIGNING_MODE == 'notarized'
        env:
          P12_FILE: ${{ runner.temp }}/opennotype-release-secrets/certificate.p12
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          RELEASE_KEYCHAIN_PATH: ${{ runner.temp }}/opennotype-release-secrets/signing.keychain-db
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: |
          umask 077
          python3 - <<'PY'
          import json, os, shlex, subprocess
          from pathlib import Path
          result = subprocess.run(['security', 'list-keychains', '-d', 'user'], check=True, capture_output=True, text=True)
          path = Path(os.environ['RUNNER_TEMP']) / 'opennotype-release-secrets/original-keychains.json'
          path.write_text(json.dumps(shlex.split(result.stdout)))
          PY
          swift scripts/import-release-certificate.swift
          security set-keychain-settings -lut 5400 "$RELEASE_KEYCHAIN_PATH"
          # This disposable keychain has an empty password; no secret is passed in argv.
          security set-key-partition-list -S apple-tool:,apple: -s -k '' "$RELEASE_KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$RELEASE_KEYCHAIN_PATH"
      - name: Store notary credentials in the disposable keychain
        if: env.RELEASE_SIGNING_MODE == 'notarized'
        env:
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
          NOTARY_KEY_FILE: ${{ runner.temp }}/opennotype-release-secrets/notary.p8
          NOTARY_KEYCHAIN: ${{ runner.temp }}/opennotype-release-secrets/signing.keychain-db
        run: |
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER"
          xcrun notarytool store-credentials opennotype-release \
            --key "$NOTARY_KEY_FILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --keychain "$NOTARY_KEYCHAIN"
      - name: Package and verify the explicitly selected distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
          NOTARY_PROFILE: opennotype-release
          NOTARY_KEYCHAIN: ${{ runner.temp }}/opennotype-release-secrets/signing.keychain-db
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/opennotype-release-secrets/sparkle.key
          RELEASE_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          if [ -n "$RELEASE_SPARKLE_PUBLIC_KEY" ]; then
            export SPARKLE_PUBLIC_ED_KEY="$RELEASE_SPARKLE_PUBLIC_KEY"
            export SPARKLE_FEED_URL='https://github.com/techjuicelab/opennotype/releases/latest/download/appcast.xml'
          else
            unset SPARKLE_PUBLIC_ED_KEY SPARKLE_FEED_URL
          fi
          scripts/package-release.sh
          python3 scripts/release-preflight.py --tag "$RELEASE_TAG" --artifacts dist
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('dist/release-metadata.json').read_text())
          if metadata.get('distribution') != os.environ['RELEASE_SIGNING_MODE']:
              raise SystemExit('Artifact distribution differs from the selected signing mode.')
          PY
      - name: Preserve verified public artifacts for the publication job
        uses: actions/upload-artifact@v4
        with:
          name: verified-stable-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Always delete temporary keys and restore the keychain search list
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'opennotype-release-secrets'
          try:
              original = directory / 'original-keychains.json'
              if original.is_file():
                  subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *json.loads(original.read_text())], check=True)
          finally:
              keychain = directory / 'signing.keychain-db'
              if keychain.exists():
                  subprocess.run(['security', 'delete-keychain', str(keychain)], check=False, capture_output=True)
              shutil.rmtree(directory, ignore_errors=True)
          PY

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-stable-release
          path: dist
      - name: Revalidate candidate and current release history before creating a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release-preflight.py --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" --check-git --check-remote --artifacts dist
      - name: Create a draft with all verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          mode = os.environ['RELEASE_SIGNING_MODE']
          metadata = json.loads(Path('dist/release-metadata.json').read_text())
          if mode not in ('community', 'notarized') or metadata.get('distribution') != mode:
              raise SystemExit('Artifact distribution differs from the selected signing mode.')
          if mode == 'community':
              notes = '''## 커뮤니티 배포 · Apple 공증 없음

          이 배포본은 Developer ID 서명과 Apple 공증을 받지 않았습니다. 앱에는 ad-hoc 코드 서명, 업데이트 ZIP에는 Sparkle Ed25519 서명을 적용했습니다. macOS가 최초 실행을 차단할 수 있습니다.

          Apple silicon · macOS 14 이상. DMG에서 앱을 Applications 폴더로 복사한 뒤 실행하세요. 출처와 내용을 확인하고 설치하기로 결정했다면 [Apple의 앱별 수동 허용 안내](https://support.apple.com/102445)에 따라 시스템 설정의 개인정보 보호 및 보안에서 해당 앱만 허용할 수 있습니다.

          기존 0.1.9 개발 설치본은 피드와 공개 키가 없어 최초 1회 수동 교체가 필요합니다. 서명 방식 변경 후 마이크·손쉬운 사용 권한이나 Keychain 접근을 다시 허용해야 할 수 있습니다. 버전 간 자동 교체와 기존 권한·Keychain 접근 유지는 아직 실기기 검증 전입니다.

          GitHub의 Latest 표시는 업데이트 채널의 최신 버전이라는 뜻이며 Apple 공증을 의미하지 않습니다. [배포 방식과 검증 범위](https://github.com/techjuicelab/opennotype/blob/main/docs/updates.md)를 확인하세요.
          '''
          else:
              notes = '''## Developer ID 서명 · Apple 공증 배포

          Developer ID 서명과 Apple 공증, Sparkle Ed25519 업데이트 서명을 검증한 배포본입니다. Apple silicon · macOS 14 이상을 지원합니다.

          DMG에서 앱을 Applications 폴더로 복사한 뒤 실행하세요. 기존 0.1.9 개발 설치본은 최초 1회 수동 교체가 필요합니다. [설치 안내와 검증 범위](https://github.com/techjuicelab/opennotype/blob/main/docs/updates.md)를 확인하세요.
          '''
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(notes, encoding='utf-8')
          PY
          if [ "$RELEASE_SIGNING_MODE" = community ]; then
            RELEASE_TITLE="OpenNoType $RELEASE_TAG — 커뮤니티 배포 · Apple 공증 없음"
          else
            RELEASE_TITLE="OpenNoType $RELEASE_TAG — Developer ID 서명 · Apple 공증"
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
      - name: Download draft assets and verify every uploaded byte
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-roundtrip"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          source = Path('dist')
          downloaded = Path(os.environ['RUNNER_TEMP']) / 'release-roundtrip'
          if {p.name for p in source.iterdir()} != {p.name for p in downloaded.iterdir()}:
              raise SystemExit('Uploaded asset set differs; draft remains unpublished.')
          for path in source.iterdir():
              def digest(stream):
                  value = hashlib.sha256()
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(chunk)
                  return value.digest()
              with path.open('rb') as left, (downloaded / path.name).open('rb') as right:
                  if digest(left) != digest(right):
                      raise SystemExit('Uploaded artifact differs; draft remains unpublished.')
          PY
          python3 scripts/release-preflight.py --tag "$RELEASE_TAG" --artifacts "$RUNNER_TEMP/release-roundtrip"
      - name: Publish only the still-newest verified draft as latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          DRAFT_ID="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          python3 scripts/release-preflight.py --tag "$RELEASE_TAG" \
            --check-remote --artifacts dist --allow-draft-id "$DRAFT_ID"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
